<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/symbols.css">
<script>try{var q=new URLSearchParams(location.search),t=q.get("theme");if(t)document.documentElement.setAttribute("data-theme",t);if(q.get("touch")==="1")document.documentElement.classList.add("ar-touch")}catch(e){}</script>
<style>html,body{background:var(--color-bg)}</style>
<meta charset="utf-8"><title>Page control — preview</title>
<style>
  body { margin:0; padding:24px; }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .cap { font:500 12px/16px var(--font-sans); letter-spacing:.5px; color:var(--color-text-secondary); }

</style></head>
<body class="ar-root">
<div class="row" style="gap:24px">
<span class="ar-pages"><span class="ar-pages__dot ar-pages__dot--current"></span><span class="ar-pages__dot"></span><span class="ar-pages__dot"></span><span class="ar-pages__dot"></span></span>
<span class="ar-pages ar-pages--platter"><span class="ar-pages__dot"></span><span class="ar-pages__dot ar-pages__dot--current"></span><span class="ar-pages__dot"></span></span>
</div>
</body>
</html>
