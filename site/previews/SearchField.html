<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/symbols.css">
<script>try{var q=new URLSearchParams(location.search),t=q.get("theme");if(t)document.documentElement.setAttribute("data-theme",t);if(q.get("touch")==="1")document.documentElement.classList.add("ar-touch")}catch(e){}</script>
<style>html,body{background:var(--color-bg)}</style>
<meta charset="utf-8"><title>Search field — preview</title>
<style>
  body { margin:0; padding:24px; }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .cap { font:500 12px/16px var(--font-sans); letter-spacing:.5px; color:var(--color-text-secondary); }

</style></head>
<body class="ar-root">
<div class="col" style="max-width:360px">
<div class="ar-search"><span class="sf" data-symbol="magnifyingglass"></span><span class="ar-input__ph">Search chats</span></div>
<div class="ar-search ar-search--focus"><span class="sf" data-symbol="magnifyingglass"></span>local-first<span class="ar-search__clear"><span class="sf" data-symbol="xmark.circle.fill"></span></span></div>
</div>
</body>
</html>
